function render() {
  const meta = document.getElementById('meta');
  meta.textContent = `${DATA.date} · 共 ${DATA.total} 条 · 更新于 ${DATA.generated_at}`;

  const app = document.getElementById('app');
  // 按来源分组
  const groups = {};
  for (const item of DATA.news) {
    if (!groups[item.source]) groups[item.source] = [];
    groups[item.source].push(item);
  }

  const order = ['新华网', '人民网', '央视网', '中新网'];
  const sortedSources = Object.keys(groups).sort((a, b) => {
    return order.indexOf(a) - order.indexOf(b);
  });

  let html = '';
  for (const src of sortedSources) {
    const items = groups[src];
    html += `<section class="source-block">`;
    html += `<div class="source-head">${src}<span class="count">${items.length}</span></div>`;
    for (const it of items) {
      html += `<div class="news-item">`;
      html += `<a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>`;
      if (it.time) html += `<div class="time">${escapeHtml(it.time)}</div>`;
      if (it.summary) html += `<div class="summary">${escapeHtml(it.summary)}</div>`;
      html += `</div>`;
    }
    html += `</section>`;
  }
  app.innerHTML = html;

  const footer = document.getElementById('footer');
  footer.textContent = '数据来源：新华网 · 人民网 · 央视网 · 中新网（每日自动更新）';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

render();
</script>
