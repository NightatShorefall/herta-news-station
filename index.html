<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑塔新闻站</title>
<style>
  :root {
    --purple: #8b5cf6;
    --purple-light: #ede9fe;
    --purple-dark: #7c3aed;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  /* ===== 头部（主题皮肤） ===== */
  .hero {
    background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 45%, #a78bfa 100%);
    color: #fff;
    padding: 28px 20px 48px;
    position: relative;
    overflow: hidden;
  }
  .hero-inner {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .hero-text h1 {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .hero-text .meta {
    font-size: .9rem;
    opacity: .92;
    margin-top: 6px;
  }
  .hero-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    flex-shrink: 0;
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .hero::before { width: 220px; height: 220px; top: -70px; right: -50px; }
  .hero::after { width: 140px; height: 140px; bottom: -60px; left: 30%; }

  /* ===== 表情墙（主题皮肤装饰） ===== */
  .skin-wall {
    max-width: 900px;
    margin: -24px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .skin-wall img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 14px;
    border: 3px solid #fff;
    box-shadow: 0 6px 18px rgba(139,92,246,.25);
    transition: transform .25s ease, box-shadow .25s ease;
    cursor: pointer;
  }
  .skin-wall img:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 28px rgba(139,92,246,.4);
  }

  /* ===== 正文 ===== */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .topic-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
    transition: box-shadow .2s ease;
  }
  .topic-card:hover { box-shadow: 0 6px 20px rgba(139,92,246,.15); }
  .topic-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }
  .topic-title {
    font-size: 1.12rem;
    font-weight: 700;
    color: var(--fg);
    text-decoration: none;
    flex: 1;
    line-height: 1.5;
  }
  .topic-title:hover { color: var(--purple); }
  .topic-badge {
    flex-shrink: 0;
    background: var(--purple-light);
    color: var(--purple-dark);
    font-size: .72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .source-tags { margin: 4px 0 8px; }
  .source-tag {
    display: inline-block;
    background: var(--purple);
    color: #fff;
    font-size: .72rem;
    border-radius: 10px;
    padding: 2px 9px;
    margin-right: 6px;
    font-weight: 500;
  }

  /* ===== 摘要（展开/收缩） ===== */
  .summary-box {
    color: var(--fg);
    font-size: .92rem;
    line-height: 1.75;
    background: #faf9ff;
    border-left: 3px solid var(--purple);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 10px;
  }
  .summary-text { word-break: break-word; }
  .summary-toggle {
    color: var(--purple);
    font-size: .82rem;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0 0;
    margin-top: 4px;
  }
  .summary-toggle:hover { text-decoration: underline; }
  .summary-full { display: none; }

  /* ===== 相关新闻列表 ===== */
  .topic-links { margin-top: 6px; }
  .topic-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-top: 1px dashed var(--border);
    font-size: .88rem;
    color: var(--fg);
    text-decoration: none;
  }
  .topic-link:first-child { border-top: none; }
  .topic-link:hover { color: var(--purple); }
  .topic-link .src { color: var(--muted); font-size: .78rem; flex-shrink: 0; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    margin-top: 40px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  @media (max-width: 640px) {
    .hero-inner { flex-direction: row; }
    .hero-img { width: 84px; height: 84px; }
    .skin-wall { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

function render() {
  const meta = document.getElementById('meta');
  meta.textContent = `${DATA.date} · 共 ${DATA.total} 个话题 · 更新于 ${DATA.generated_at}`;

  const app = document.getElementById('app');
  let html = '';
  for (const tp of DATA.topics) {
    html += `<article class="topic-card">`;
    html += `<div class="topic-head">`;
    html += `<a class="topic-title" href="${tp.items[0].link}" target="_blank" rel="noopener">${esc(tp.title)}</a>`;
    html += `<span class="topic-badge">${tp.count} 条</span>`;
    html += `</div>`;
    html += `<div class="source-tags">`;
    tp.sources.forEach(s => { html += `<span class="source-tag">${esc(s)}</span>`; });
    html += `</div>`;

    // 摘要（展开/收缩）
    if (tp.summary) {
      const short = tp.summary.length > 80 ? tp.summary.slice(0, 80) + '…' : tp.summary;
      html += `<div class="summary-box">`;
      html += `<div class="summary-text">${esc(short)}</div>`;
      if (tp.summary.length > 80) {
        html += `<div class="summary-text summary-full">${esc(tp.summary)}</div>`;
        html += `<button class="summary-toggle" onclick="toggleSummary(this)">展开全文</button>`;
      }
      html += `</div>`;
    }

    // 相关新闻
    html += `<div class="topic-links">`;
    tp.items.forEach(it => {
      html += `<a class="topic-link" href="${it.link}" target="_blank" rel="noopener">`;
      html += `<span class="src">${esc(it.source)}</span><span>${esc(it.title)}</span>`;
      html += `</a>`;
    });
    html += `</div></article>`;
  }
  app.innerHTML = html;

  document.getElementById('footer').textContent = '数据来源：新华网 · 人民网 · 央视网 · 中新网（每日自动更新）';
}

function toggleSummary(btn) {
  const box = btn.closest('.summary-box');
  const short = box.querySelector('.summary-text');
  const full = box.querySelector('.summary-full');
  if (full) {
    const isOpen = full.style.display === 'block';
    full.style.display = isOpen ? 'none' : 'block';
    short.style.display = isOpen ? 'block' : 'none';
    btn.textContent = isOpen ? '展开全文' : '收起';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

render();
</script>
