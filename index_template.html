<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑塔新闻站</title>
<style>
  :root {
    --purple: #8b5cf6;
    --purple-dark: #7c3aed;
    --purple-deep: #5b21b6;
    --purple-light: #ede9fe;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.55;
  }

  /* ===== 头部 ===== */
  .hero {
    background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 45%, #8b5cf6 100%);
    padding: 22px 20px 44px;
    position: relative;
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%;
    background: rgba(255,255,255,.07);
  }
  .hero::before { width: 200px; height: 200px; top: -80px; right: -40px; }
  .hero::after { width: 130px; height: 130px; bottom: -60px; left: 32%; }
  .hero-inner {
    max-width: 1080px; margin: 0 auto;
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 16px;
  }
  .hero-img {
    width: 56px; height: 56px; border-radius: 50%;
    object-fit: cover;
    border: 2.5px solid rgba(255,255,255,.9);
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    flex-shrink: 0;
  }
  .hero-text h1 {
    font-size: 1.55rem; font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #fff 0%, #f5f3ff 50%, #ddd6fe 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(255,255,255,.15);
  }
  .hero-text .meta {
    font-size: .82rem; color: #e9d5ff;
    margin-top: 4px; letter-spacing: .5px;
  }

  /* ===== 表情皮肤墙（紧凑横条） ===== */
  .skin-wall {
    max-width: 1080px; margin: -26px auto 0;
    padding: 0 20px; position: relative; z-index: 3;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .skin-wall img {
    width: 100%; aspect-ratio: 16/7;
    object-fit: cover; border-radius: 12px;
    border: 2.5px solid #fff;
    box-shadow: 0 4px 14px rgba(91,33,182,.2);
    transition: transform .2s ease;
    cursor: pointer;
  }
  .skin-wall img:hover { transform: translateY(-3px); }

  /* ===== 方块网格（B站风格） ===== */
  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 50px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 26px rgba(139,92,246,.18);
    border-color: #ddd6fe;
  }
  /* 缩略图 */
  .thumb {
    position: relative;
    aspect-ratio: 16/10;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .thumb .thumb-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    opacity: .92;
  }
  .thumb .thumb-char {
    position: relative;
    font-size: 2.2rem; font-weight: 800; color: rgba(255,255,255,.92);
    letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(0,0,0,.2);
  }
  .thumb .thumb-count {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255,255,255,.92); color: var(--purple-deep);
    font-size: .68rem; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
  }
  .thumb .thumb-srcs {
    position: absolute; bottom: 8px; left: 8px;
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .thumb .thumb-srcs span {
    background: rgba(0,0,0,.42); color: #fff;
    font-size: .64rem; padding: 1px 7px; border-radius: 8px;
    backdrop-filter: blur(4px);
  }
  /* 卡片体 */
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; flex: 1; }
  .card-title {
    font-size: .95rem; font-weight: 700; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.9em;
  }
  .card-meta {
    margin-top: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-meta .src-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); }
  .card-meta .src-name { font-size: .72rem; color: var(--muted); }
  .card-meta .sep { flex: 1; }
  .card-meta .toggle-btn {
    font-size: .72rem; color: var(--purple); font-weight: 600;
    background: none; border: none; cursor: pointer; padding: 2px 0;
  }
  .card-meta .toggle-btn:hover { text-decoration: underline; }
  /* 摘要（默认收起） */
  .card-summary {
    display: none;
    margin-top: 10px; padding: 9px 11px;
    background: #faf9ff; border-left: 3px solid var(--purple);
    border-radius: 0 8px 8px 0;
    font-size: .82rem; color: #374151; line-height: 1.7;
  }
  .card.open .card-summary { display: block; }

  footer {
    text-align: center; color: var(--muted); font-size: .78rem;
    margin-top: 30px; border-top: 1px solid var(--border); padding: 14px 0 20px;
  }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .skin-wall { grid-template-columns: repeat(2, 1fr); }
    .card-title { font-size: .88rem; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <img class="hero-img" src="images/9E00EF724EC4F35AB0FCB505C26EC23E.webp" alt="黑塔">
    <div class="hero-text">
      <h1>黑塔新闻站</h1>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</header>

<div class="skin-wall">
  <img src="images/031CD5CAA7B0D9C5FCED78A85DD81613.webp" alt="表情1" loading="lazy" onclick="window.open(this.src,'_blank')">
  <img src="images/991D5CF2E798946D51C49B5835E8E393.webp" alt="表情2" loading="lazy" onclick="window.open(this.src,'_blank')">
  <img src="images/EFD2AD77BB68E4FDE53F50FE548E8D69.webp" alt="表情3" loading="lazy" onclick="window.open(this.src,'_blank')">
  <img src="images/9E00EF724EC4F35AB0FCB505C26EC23E.webp" alt="表情4" loading="lazy" onclick="window.open(this.src,'_blank')">
</div>

<main>
  <div class="grid" id="app"></div>
</main>

<footer id="footer"></footer>

<script>
const DATA = __JSON_DATA__;

const GRADS = [
  'linear-gradient(135deg,#5b21b6,#8b5cf6)',
  'linear-gradient(135deg,#7c3aed,#a78bfa)',
  'linear-gradient(135deg,#6d28d9,#c4b5fd)',
  'linear-gradient(135deg,#8b5cf6,#ddd6fe)',
  'linear-gradient(135deg,#4c1d95,#7c3aed)'
];

function render() {
  document.getElementById('meta').textContent =
    DATA.date + ' · 跨站要闻 ' + DATA.total + ' 条 · ' + DATA.generated_at.slice(11, 16) + ' 更新';

  const app = document.getElementById('app');
  let html = '';
  DATA.topics.forEach((tp, i) => {
    const grad = GRADS[i % GRADS.length];
    const char = tp.title.trim().charAt(0);
    const srcs = tp.sources.join(' · ');
    html += `<article class="card" onclick="toggleCard(this)">`;
    html += `<div class="thumb"><div class="thumb-bg" style="background:${grad}"></div>`;
    html += `<span class="thumb-char">${esc(char)}</span>`;
    html += `<span class="thumb-count">${tp.sources.length} 家报道</span>`;
    html += `<span class="thumb-srcs">${tp.sources.map(s => `<span>${esc(s)}</span>`).join('')}</span>`;
    html += `</div>`;
    html += `<div class="card-body">`;
    html += `<a class="card-title" href="${tp.items[0].link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(tp.title)}</a>`;
    html += `<div class="card-meta">`;
    html += `<span class="src-dot"></span><span class="src-name">${esc(srcs)}</span>`;
    html += `<span class="sep"></span><button class="toggle-btn" onclick="event.stopPropagation();toggleCard(this.closest('.card'))">摘要</button>`;
    html += `</div>`;
    html += `<div class="card-summary">${esc(tp.summary)}</div>`;
    html += `</div></article>`;
  });
  app.innerHTML = html;

  document.getElementById('footer').textContent =
    '数据来源：新华网 · 人民网 · 央视网 · 中新网（每日自动更新，仅保留跨站要闻）';
}

function toggleCard(card) {
  card.classList.toggle('open');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

render();
</script>
</body>
</html>
